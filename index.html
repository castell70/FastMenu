<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FastMenu · Sistema de Gestión para Restaurantes</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --orange:#f97316; --orange-600:#ea580c; --orange-700:#c2410c; --orange-50:#fff7ed; --orange-100:#ffedd5;
  --blue:#2563eb; --blue-50:#eff6ff; --blue-100:#dbeafe;
  --green:#16a34a; --green-50:#f0fdf4; --green-100:#dcfce7;
  --gray:#6b7280; --gray-100:#f3f4f6; --gray-200:#e5e7eb; --gray-300:#d1d5db; --gray-600:#4b5563;
  --ink:#111827; --ink-soft:#374151;
  --red:#dc2626; --red-50:#fef2f2;
  --radius:10px; --radius-lg:14px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --shadow-lg:0 10px 30px rgba(0,0,0,.12);
}
html,body{height:100%}
body{
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  background:#ffffff; color:var(--ink); font-size:15px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--blue);text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--gray-300);border-radius:8px}
::-webkit-scrollbar-track{background:var(--gray-100)}
.login-screen{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#fff7ed 0%,#ffffff 45%,#eff6ff 100%);padding:24px;
}
.login-card{width:100%;max-width:400px;background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);border:1px solid var(--gray-200);overflow:hidden}
.login-head{background:linear-gradient(135deg,var(--orange),var(--orange-600));color:#fff;padding:26px 24px;text-align:center}
.login-head .logo{font-size:34px;font-weight:800;letter-spacing:-1px;line-height:1}
.login-head .logo span{color:#fff7ed}
.login-head p{opacity:.92;font-size:13px;margin-top:6px}
.login-body{padding:24px}
.login-body label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;margin-top:14px}
.login-body input{width:100%;padding:11px 13px;border:1px solid var(--gray-300);border-radius:var(--radius);outline:none;transition:.15s}
.login-body input:focus{border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-100)}
.hint{margin-top:16px;font-size:12.5px;color:var(--gray);background:var(--gray-100);border-radius:var(--radius);padding:10px 12px;text-align:center}
#app{display:none;flex-direction:column;min-height:100vh}
.app-header{background:linear-gradient(135deg,var(--orange) 0%,var(--orange-600) 100%);color:#fff;display:flex;align-items:center;gap:14px;padding:0 18px;height:62px;position:sticky;top:0;z-index:60;box-shadow:0 2px 10px rgba(249,115,22,.28)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.5px;white-space:nowrap}
.brand .dot{width:28px;height:28px;border-radius:9px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:15px}
.brand small{display:block;font-size:10px;font-weight:500;opacity:.85;letter-spacing:.5px;margin-top:-3px}
.header-spacer{flex:1}
.header-user{display:flex;align-items:center;gap:10px;font-size:13px;text-align:right}
.header-user .uname{font-weight:600;line-height:1.1}
.header-user .urole{font-size:11px;opacity:.85}
.avatar{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.24);display:grid;place-items:center;font-weight:700;font-size:14px}
.icon-btn{background:rgba(255,255,255,.16);border:none;color:#fff;width:36px;height:36px;border-radius:9px;cursor:pointer;font-size:17px;display:grid;place-items:center;transition:.15s}
.icon-btn:hover{background:rgba(255,255,255,.3)}
#menuToggle{display:none}
.layout{display:flex;flex:1;align-items:stretch}
.sidebar{width:236px;flex-shrink:0;background:#fff;border-right:1px solid var(--gray-200);padding:14px 10px;display:flex;flex-direction:column;gap:3px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--radius);cursor:pointer;font-size:14px;font-weight:500;color:var(--ink-soft);transition:.14s;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:var(--orange-50);color:var(--orange-700)}
.nav-item.active{background:var(--orange);color:#fff;font-weight:600;box-shadow:0 3px 10px rgba(249,115,22,.3)}
.nav-item.active .nicon{filter:brightness(0) invert(1)}
.nicon{font-size:17px;width:20px;text-align:center}
.nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--gray);padding:8px 12px 3px;font-weight:700}
.main{flex:1;padding:22px;min-width:0;overflow-x:auto}
.overlay{display:none;position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:55}
.app-footer{border-top:1px solid var(--gray-200);padding:14px 22px;text-align:center;font-size:12.5px;color:var(--gray);background:#fff}
.app-footer strong{color:var(--orange-600)}
.page-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:18px}
.page-head h1{font-size:23px;font-weight:700;letter-spacing:-.4px}
.page-head p{font-size:13px;color:var(--gray);width:100%;margin-top:-6px}
.page-head .spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--orange);color:#fff;border:none;padding:10px 16px;border-radius:var(--radius);cursor:pointer;font-weight:600;font-size:13.5px;transition:.15s;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.btn:hover{background:var(--orange-600);transform:translateY(-1px);box-shadow:0 4px 10px rgba(249,115,22,.28)}
.btn:active{transform:translateY(0)}
.btn.blue{background:var(--blue)}.btn.blue:hover{background:#1d4ed8;box-shadow:0 4px 10px rgba(37,99,235,.28)}
.btn.green{background:var(--green)}.btn.green:hover{background:#15803d;box-shadow:0 4px 10px rgba(22,163,74,.28)}
.btn.gray{background:var(--gray)}.btn.gray:hover{background:#4b5563;box-shadow:0 4px 10px rgba(107,114,128,.25)}
.btn.red{background:var(--red)}.btn.red:hover{background:#b91c1c;box-shadow:0 4px 10px rgba(220,38,38,.25)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
.card{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
.card h3{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 .badge{margin-left:auto}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-lg);padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--orange)}
.kpi.blue::before{background:var(--blue)}.kpi.green::before{background:var(--green)}.kpi.gray::before{background:var(--gray)}
.kpi .k-label{font-size:12px;color:var(--gray);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.kpi .k-value{font-size:26px;font-weight:800;margin-top:6px;letter-spacing:-.8px}
.kpi .k-sub{font-size:12px;color:var(--gray);margin-top:3px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--gray-200)}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:520px}
thead th{background:var(--gray-100);text-align:left;padding:10px 13px;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--gray-600);white-space:nowrap;border-bottom:1px solid var(--gray-200)}
tbody td{padding:10px 13px;border-bottom:1px solid var(--gray-100);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--orange-50)}
.t-right{text-align:right}
.t-center{text-align:center}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill.orange{background:var(--orange-100);color:var(--orange-700)}
.pill.blue{background:var(--blue-100);color:#1e40af}
.pill.green{background:var(--green-100);color:#166534}
.pill.gray{background:var(--gray-100);color:var(--gray-600)}
.pill.red{background:var(--red-50);color:#991b1b}
.pill.sync{background:var(--green-100);color:#166534}
.badge{background:var(--orange);color:#fff;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px}
.badge.gray{background:var(--gray)}.badge.blue{background:var(--blue)}.badge.green{background:var(--green)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.input,.select{padding:9px 12px;border:1px solid var(--gray-300);border-radius:var(--radius);outline:none;transition:.15s;background:#fff;font-size:13.5px}
.input:focus,.select:focus{border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-100)}
.input.search{min-width:230px;flex:1;max-width:340px}
textarea.input{resize:vertical;min-height:70px;width:100%}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12.5px;font-weight:600;color:var(--ink-soft)}
.field .input,.field .select{width:100%}
.field.full{grid-column:1/-1}
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(17,24,39,.5);z-index:100;padding:18px;overflow-y:auto}
.modal-backdrop.show{display:flex;align-items:flex-start;justify-content:center}
.modal{background:#fff;border-radius:var(--radius-lg);width:100%;max-width:600px;box-shadow:var(--shadow-lg);margin:auto;animation:pop .16s ease}
.modal.lg{max-width:1080px}
.modal.xl{max-width:1240px}
@keyframes pop{from{transform:translateY(10px) scale(.99);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--gray-200);position:sticky;top:0;background:#fff;border-radius:var(--radius-lg) var(--radius-lg) 0 0;z-index:2}
.modal-head h3{font-size:17px;font-weight:700}
.modal-head .x{margin-left:auto;background:var(--gray-100);border:none;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:19px;color:var(--gray-600);line-height:1}
.modal-head .x:hover{background:var(--gray-200)}
.modal-body{padding:20px}
.modal-foot{padding:14px 20px;border-top:1px solid var(--gray-200);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;background:var(--gray-100);border-radius:0 0 var(--radius-lg) var(--radius-lg)}
.pos-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:18px}
.pos-cats{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}
.cat-chip{padding:6px 13px;border-radius:999px;background:var(--gray-100);border:1px solid var(--gray-200);cursor:pointer;font-size:12.5px;font-weight:600;color:var(--gray-600);transition:.14s}
.cat-chip:hover{border-color:var(--orange);color:var(--orange-700)}
.cat-chip.active{background:var(--orange);border-color:var(--orange);color:#fff}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;max-height:420px;overflow-y:auto;padding:2px}
.prod-card{border:1px solid var(--gray-200);border-radius:var(--radius);padding:11px;cursor:pointer;background:#fff;transition:.14s;display:flex;flex-direction:column;gap:5px;min-height:82px;justify-content:space-between}
.prod-card:hover{border-color:var(--orange);box-shadow:0 4px 12px rgba(249,115,22,.16);transform:translateY(-2px)}
.prod-card .pn{font-weight:600;font-size:13px;line-height:1.25}
.prod-card .pp{color:var(--orange-600);font-weight:800;font-size:14px}
.prod-card .pc{font-size:10.5px;color:var(--gray);text-transform:uppercase;letter-spacing:.5px}
.cart-box{border:1px solid var(--gray-200);border-radius:var(--radius);display:flex;flex-direction:column;background:#fff;max-height:560px}
.cart-head{padding:11px 14px;border-bottom:1px solid var(--gray-200);font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;background:var(--gray-100);border-radius:var(--radius) var(--radius) 0 0}
.cart-items{flex:1;overflow-y:auto;padding:8px;min-height:130px}
.cart-item{display:flex;gap:9px;align-items:center;padding:8px;border-bottom:1px solid var(--gray-100)}
.cart-item:last-child{border-bottom:none}
.cart-item .ci-name{font-weight:600;font-size:13px;flex:1;line-height:1.2}
.cart-item .ci-price{font-size:11.5px;color:var(--gray)}
.qty-ctrl{display:flex;align-items:center;gap:4px}
.qty-ctrl button{width:25px;height:25px;border-radius:7px;border:1px solid var(--gray-300);background:#fff;cursor:pointer;font-weight:700;color:var(--gray-600);line-height:1}
.qty-ctrl button:hover{background:var(--orange);color:#fff;border-color:var(--orange)}
.qty-ctrl span{min-width:24px;text-align:center;font-weight:700;font-size:13px}
.cart-totals{padding:12px 14px;border-top:1px solid var(--gray-200);background:var(--gray-100);font-size:13.5px;border-radius:0 0 var(--radius) var(--radius)}
.tot-row{display:flex;justify-content:space-between;padding:3px 0;color:var(--gray-600)}
.tot-row.big{font-size:19px;font-weight:800;color:var(--ink);border-top:1px dashed var(--gray-300);margin-top:7px;padding-top:9px}
.tot-row .val{font-weight:700;color:var(--ink)}
.bars{display:flex;align-items:flex-end;gap:8px;height:180px;padding:10px 4px 0;border-bottom:2px solid var(--gray-200)}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end;height:100%}
.bar{width:100%;max-width:46px;background:linear-gradient(180deg,var(--orange),var(--orange-600));border-radius:7px 7px 0 0;min-height:4px;transition:.3s;position:relative}
.bar:hover{filter:brightness(1.08)}
.bar-lbl{font-size:10.5px;color:var(--gray);white-space:nowrap}
.bar-val{font-size:10.5px;font-weight:700;color:var(--orange-700)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--gray);margin-top:10px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px}
.hbar{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:13px}
.hbar .hb-name{width:130px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.hbar .hb-track{flex:1;height:9px;background:var(--gray-100);border-radius:6px;overflow:hidden}
.hbar .hb-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--orange),var(--orange-600))}
.hbar .hb-fill.blue{background:linear-gradient(90deg,#60a5fa,var(--blue))}
.hbar .hb-fill.green{background:linear-gradient(90deg,#4ade80,var(--green))}
.hbar .hb-val{width:78px;text-align:right;font-weight:700;font-size:12.5px}
.empty{text-align:center;padding:34px 18px;color:var(--gray)}
.empty .ico{font-size:38px;opacity:.35;display:block;margin-bottom:8px}
.tabs{display:flex;gap:5px;border-bottom:2px solid var(--gray-200);margin-bottom:18px;overflow-x:auto}
.tab{padding:9px 16px;background:none;border:none;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--gray);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:.14s}
.tab:hover{color:var(--orange-600)}
.tab.active{color:var(--orange-600);border-bottom-color:var(--orange)}
#toasts{position:fixed;top:74px;right:18px;z-index:200;display:flex;flex-direction:column;gap:9px;max-width:340px}
.toast{background:#fff;border-left:5px solid var(--orange);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:12px 15px;font-size:13.5px;font-weight:500;animation:slideIn .22s ease;display:flex;gap:9px;align-items:flex-start}
.toast.success{border-left-color:var(--green)}.toast.error{border-left-color:var(--red)}.toast.info{border-left-color:var(--blue)}
@keyframes slideIn{from{transform:translateX(28px);opacity:0}to{transform:none;opacity:1}}
.alert-box{border-radius:var(--radius);padding:12px 15px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start;margin-bottom:14px}
.alert-box.warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e}
.alert-box.info{background:var(--blue-50);border:1px solid var(--blue-100);color:#1e40af}
.alert-box.danger{background:var(--red-50);border:1px solid #fecaca;color:#991b1b}
.alert-box.sync{background:var(--green-50);border:1px solid var(--green-100);color:#166534}
.tool-card{border:1px solid var(--gray-200);border-radius:var(--radius-lg);padding:18px;background:#fff;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.tool-card h4{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.tool-card p{font-size:12.5px;color:var(--gray);line-height:1.5;flex:1}
.tool-card .acts{display:flex;gap:8px;flex-wrap:wrap}
.stat-mini{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px dashed var(--gray-200)}
.stat-mini:last-child{border-bottom:none}
.stat-mini .v{font-weight:700}
.help-section{margin-bottom:18px}
.help-section h3{font-size:16px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:9px;color:var(--ink)}
.help-section h3 .num{background:var(--orange);color:#fff;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;flex-shrink:0}
.help-section p{font-size:13.5px;color:var(--ink-soft);line-height:1.65;margin-bottom:8px}
.help-section ul{font-size:13.5px;padding-left:22px;line-height:1.75;color:var(--ink-soft);margin-bottom:8px}
.help-section ul li{margin-bottom:3px}
.help-tip{background:var(--orange-50);border-left:4px solid var(--orange);padding:10px 14px;border-radius:8px;font-size:13px;color:var(--orange-700);margin:10px 0;line-height:1.55}
.help-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:12px 0}
.help-step{background:var(--gray-100);border-radius:10px;padding:13px 15px;font-size:13px;line-height:1.5}
.help-step strong{color:var(--orange-700);display:block;margin-bottom:4px;font-size:12.5px}
.copyright-box{text-align:center;background:linear-gradient(135deg,var(--orange-50),#ffffff,var(--blue-50));border:1px solid var(--gray-200);border-radius:var(--radius-lg);padding:24px 18px;margin-top:24px}
.copyright-box .c-title{font-size:16px;font-weight:800;color:var(--orange-700);margin-bottom:6px}
.copyright-box .c-sub{font-size:13px;color:var(--gray-600);line-height:1.6}
.copyright-box .c-line{width:60px;height:3px;background:var(--orange);border-radius:2px;margin:12px auto}
.chain{display:flex;align-items:center;gap:8px;background:var(--green-50);border:1px solid var(--green-100);border-radius:10px;padding:10px 14px;font-size:12.5px;color:#166534;flex-wrap:wrap;margin:10px 0}
.chain .arrow{color:var(--orange);font-weight:700}
@media(max-width:1000px){.pos-grid{grid-template-columns:1fr}.grid-2{grid-template-columns:1fr}}
@media(max-width:860px){
  #menuToggle{display:grid}
  .sidebar{position:fixed;top:0;left:0;bottom:0;z-index:70;transform:translateX(-100%);transition:transform .22s ease;box-shadow:var(--shadow-lg);width:250px;padding-top:18px}
  .sidebar.open{transform:none}
  .overlay.show{display:block}
  .main{padding:15px}
  .header-user .uname,.header-user .urole{display:none}
  .page-head h1{font-size:19px}
  .kpi .k-value{font-size:22px}
  .brand small{display:none}
}
@media(max-width:560px){
  .app-header{padding:0 12px;height:56px}
  .brand{font-size:17px}
  .main{padding:12px}
  .card{padding:14px}
  .toolbar{gap:8px}
  .input.search{min-width:100%;max-width:100%}
  .prod-grid{grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}
  .modal-body{padding:14px}
  .modal-foot{padding:12px 14px}
  .modal-foot .btn{flex:1}
  .hbar .hb-name{width:88px}
  .hbar .hb-val{width:62px;font-size:11.5px}
}
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="login-head">
      <div class="logo">Fast<span>Menu</span></div>
      <p>Sistema Integral de Gestión para Restaurantes</p>
    </div>

}

function searchDebounced(el, renderFn, delay=180){
  const id = el.id;
  if(!id){ renderFn(); return; }
  const start = (el.selectionStart!=null) ? el.selectionStart : el.value.length;
  const end   = (el.selectionEnd!=null)   ? el.selectionEnd   : el.value.length;
  window['_sb_'+id] = { start, end };
  clearTimeout(window['_st_'+id]);
  window['_st_'+id] = setTimeout(()=>{
    renderFn();
    const newEl = document.getElementById(id);
    if(newEl){
      try{
        newEl.focus({preventScroll:true});
        const pos = window['_sb_'+id] || { start: newEl.value.length, end: newEl.value.length };
        newEl.setSelectionRange(pos.start, pos.end);
      }catch(e){}
    }
  }, delay);
}

/* =======================================================================
   ⭐ SINCRONIZACIÓN DE COSTOS (Insumo → Receta → Producto)
   =======================================================================
   Cadena de cálculo:
     1. El costo de cada insumo vive en DB.insumos[].costo
     2. El costo de la receta se calcula: Σ (costo insumo × cantidad)
     3. El costo del producto con receta se sincroniza con el de la receta
   La sincronización se dispara en TODOS estos puntos:
     - Al agregar un ingrediente (addIngrediente)
     - Al eliminar un ingrediente (delIngrediente)
     - Al editar la cantidad de un ingrediente (guardarEditIngrediente)
     - Al cambiar el costo de un insumo (guardarInsumo)
     - Al eliminar un insumo (eliminarInsumo)
     - Al abrir el formulario de producto (formProducto)
     - Al guardar un producto con receta (guardarProducto)
     - Al cargar un respaldo o restablecer (normalizeDB)
     - Al importar plantillas de insumos/productos (syncAllProductCosts)
   ======================================================================= */

/** Calcula el costo de la receta de un producto a partir de los insumos actuales. */
function calcRecipeCost(product){
  if(!product || !Array.isArray(product.receta) || !product.receta.length) return 0;
  return product.receta.reduce((sum, r) => {
    const ins = DB.insumos.find(i => i.id === r.insumoId);
    return sum + (ins ? num(ins.costo) * num(r.cantidad) : 0);
  }, 0);
}

/**
 * Sincroniza el campo `costo` de un producto con su receta.
 * Si la receta tiene items, el costo = suma de (costo insumo × cantidad).
 * Si la receta está vacía, NO se toca el costo (queda como valor manual).
 * Devuelve true si hubo cambio.
 */
function syncProductCost(product){
  if(!product) return false;
  const rec = Array.isArray(product.receta) ? product.receta : [];
  if(rec.length === 0) return false;      // sin receta: costo manual, no tocar
  const calculado = calcRecipeCost(product);
  const nuevo = Math.round(calculado * 100) / 100;
  const actual = num(product.costo);
  if(Math.abs(actual - nuevo) > 0.001){
    product.costo = nuevo;
    return true;
  }
  return false;
}

/** Sincroniza TODOS los productos (usado cuando cambia un insumo o al cargar datos). */
function syncAllProductCosts(){
  let cambios = 0;
  DB.productos.forEach(p => { if(syncProductCost(p)) cambios++; });
  return cambios;
}

function loadDB(){
  try{
    const raw = localStorage.getItem(LS_DB);
    DB = raw ? JSON.parse(raw) : defaultDB();
  }catch(e){ DB = defaultDB(); }
  normalizeDB();
}
function normalizeDB(){
  const d = defaultDB();
  for(const k of Object.keys(d)) if(DB[k]===undefined) DB[k]=d[k];
  DB.empresa = Object.assign({}, d.empresa, DB.empresa||{});
  DB.fidelizacion = Object.assign({}, d.fidelizacion, DB.fidelizacion||{});
  ['sucursales','usuarios','categorias','insumos','productos','clientes','pedidos','movimientos','puntos'].forEach(k=>{
    if(!Array.isArray(DB[k])) DB[k]=[];
  });
  if(!DB.contadorPedido) DB.contadorPedido = (DB.pedidos.length+1);
  // Asegura que cada producto tenga su array de receta
  DB.productos.forEach(p => { if(!Array.isArray(p.receta)) p.receta = []; });
  // ⭐ Sincronización inicial: garantiza coherencia al cargar datos
  syncAllProductCosts();
}

function doLogin(){

  session = { userId:user.id, nombre:user.nombre, usuario:user.usuario, rol:user.rol, sucursalId:user.sucursalId };
  localStorage.setItem(LS_SES, JSON.stringify(session));

  try{

    if(!raw) return false;
    const s = JSON.parse(raw);
    const u = DB.usuarios.find(x=>x.id===s.userId);

    session = { userId:u.id, nombre:u.nombre, usuario:u.usuario, rol:u.rol, sucursalId:u.sucursalId };

function buildSidebar(){

      if(item.perm && !item.perm()) return;
      html += `<div class="nav-label">${item.group}</div>`;
      return;
    }
    if(item.perm && !item.perm()) return;
    html += `<button class="nav-item" data-view="${item.v}" onclick="navigate('${item.v}')">
      <span class="nicon">${item.ico}</span><span>${item.label}</span></button>`;
  });
  sb.innerHTML = html;
}

  $('#overlay').classList.remove('show');

}

function cambiarEstadoPedido(id){
  const p = DB.pedidos.find(x=>x.id===id); if(!p) return;
  const nuevo = $('#vpEstado').value;
  const anterior = p.estado;
  if(nuevo === anterior){ closeModal(); return; }
  if(nuevo==='Pagado' && anterior!=='Pagado'){
    if(!confirm('¿Confirmar pago? Se descontará inventario según recetas y se otorgarán puntos al cliente.')) return;
    p.estado = 'Pagado';
    p.fechaPago = nowISO();
    aplicarInventario(p);
    otorgarPuntos(p);
  } else {
    p.estado = nuevo;
  }
  saveDB(); closeModal(); VIEWS.pedidos();
  toast('Estado del pedido actualizado a "'+nuevo+'"','success');
}

function eliminarPedido(id){
  const p = DB.pedidos.find(x=>x.id===id); if(!p) return;
  confirmDialog('Eliminar pedido', `¿Está seguro de eliminar el pedido <strong>#${esc(p.numero)}</strong>? Esta acción no se puede deshacer.`, ()=>{
    DB.pedidos = DB.pedidos.filter(x=>x.id!==id);
    saveDB(); VIEWS.pedidos(); toast('Pedido eliminado','info');
  },'Eliminar');
}

let posState = null;

function openPOS(editId){
  if(editId && !isAdmin()){ toast('Solo el administrador puede editar pedidos','error'); return; }
  const base = {
    id:null, tipo:'Mesa', sucursalId: (DB.sucursales[0]||{}).id || '',
    clienteId:'', mesa:'', direccion:'', notas:'',
    items:[], descuento:0, puntosCanje:0, pago:'Efectivo',
    estado:'Pendiente', catFiltro:'todas', busqueda:''
  };
  if(editId){
    const p = DB.pedidos.find(x=>x.id===editId);
    if(p) Object.assign(base, JSON.parse(JSON.stringify(p)));
  }
  posState = base;
  openModal(editId?('Editar Pedido #'+esc(posState.numero)):'Nuevo Pedido', '', '', 'xl');
  renderPOS();
}

function nombreCat(id){ const c = DB.categorias.find(x=>x.id===id); return c?c.nombre:'General'; }

function addToCart(pid){
  const p = DB.productos.find(x=>x.id===pid); if(!p) return;
  const ex = posState.items.find(i=>i.productoId===pid && !i.notas);
  if(ex) ex.cantidad = num(ex.cantidad)+1;
  else posState.items.push({ productoId:pid, nombre:p.nombre, precio:num(p.precio), cantidad:1, notas:'' });
  renderPOS();
}
function chgQty(ix,d){
  const it = posState.items[ix]; if(!it) return;
  it.cantidad = num(it.cantidad)+d;
  if(it.cantidad<=0) posState.items.splice(ix,1);
  renderPOS();
}
function delItem(ix){ posState.items.splice(ix,1); renderPOS(); }

function guardarPedido(cobrar){
  const ps = posState;
  if(!ps.items.length){ toast('Debe agregar al menos un producto','error'); return; }

  const subtotal = ps.items.reduce((s,i)=> s + num(i.precio)*num(i.cantidad), 0);
  const desc = num(ps.descuento);
  const cliente = DB.clientes.find(c=>c.id===ps.clienteId);
  const canje = Math.min(num(ps.puntosCanje), cliente?num(cliente.puntos):0);
  const valorPuntos = canje * num(DB.fidelizacion.valorPunto);
  const baseGrav = Math.max(0, subtotal - desc - valorPuntos);
  const impuesto = baseGrav * num(DB.empresa.impuesto)/100;
  const total = baseGrav + impuesto;

  let pedido;
  if(ps.id){ pedido = DB.pedidos.find(x=>x.id===ps.id); }
  else {
    pedido = { id: uid('ped'), numero: DB.contadorPedido++, fecha: nowISO(), usuarioId: session.userId, usuarioNombre: session.nombre };
    DB.pedidos.push(pedido);
  }
  Object.assign(pedido, {
    tipo: ps.tipo, sucursalId: ps.sucursalId,
    clienteId: ps.clienteId || '', clienteNombre: cliente ? cliente.nombre : '',
    mesa: ps.tipo==='Mesa' ? ps.mesa : '', direccion: ps.tipo!=='Mesa' ? ps.direccion : '',
    items: ps.items.map(i=>({...i})),
    subtotal, descuento: desc, puntosCanje: canje, valorPuntos,
    impuesto, total, pago: ps.pago, notas: ps.notas,
    estado: cobrar ? 'Pagado' : ps.estado
  });

  if(cobrar && !pedido.fechaPago) pedido.fechaPago = nowISO();

  if(cobrar && !pedido._procesado){
    pedido._procesado = true;
    aplicarInventario(pedido);
    otorgarPuntos(pedido);
  } else if(!cobrar){
    if(pedido.estado!=='Pagado') pedido._procesado = false;
  }

  saveDB(); closeModal(); VIEWS.pedidos();
  toast(cobrar ? `Pedido #${pedido.numero} cobrado · ${fmtMoney(total)}` : `Pedido #${pedido.numero} guardado`, 'success');
}

function aplicarInventario(pedido){
  (pedido.items||[]).forEach(it=>{
    const prod = DB.productos.find(p=>p.id===it.productoId);
    if(!prod || !Array.isArray(prod.receta)) return;
    prod.receta.forEach(r=>{
      const ins = DB.insumos.find(i=>i.id===r.insumoId); if(!ins) return;
      const cant = num(r.cantidad) * num(it.cantidad);
      ins.stock = num(ins.stock) - cant;
      DB.movimientos.push({
        id: uid('mov'), insumoId: ins.id, insumoNombre: ins.nombre,
        tipo:'Salida', cantidad: cant, motivo:`Consumo pedido #${pedido.numero}`,
        fecha: nowISO(), usuario: session.nombre, pedidoId: pedido.id
      });
    });
  });
}

function otorgarPuntos(pedido){
  if(!DB.fidelizacion.activo || !pedido.clienteId) return;
  const cli = DB.clientes.find(c=>c.id===pedido.clienteId); if(!cli) return;

  if(num(pedido.puntosCanje)>0){
    cli.puntos = num(cli.puntos) - num(pedido.puntosCanje);
    DB.puntos.push({ id:uid('pts'), clienteId:cli.id, clienteNombre:cli.nombre, tipo:'Canjeado', puntos:-num(pedido.puntosCanje), pedidoId:pedido.id, fecha:nowISO(), nota:`Canje en pedido #${pedido.numero}` });
  }
  const ganados = Math.floor(num(pedido.total) / Math.max(1,num(DB.fidelizacion.montoPorPunto)));
  if(ganados>0){
    cli.puntos = num(cli.puntos) + ganados;
    pedido.puntosGanados = ganados;
    DB.puntos.push({ id:uid('pts'), clienteId:cli.id, clienteNombre:cli.nombre, tipo:'Ganado', puntos:ganados, pedidoId:pedido.id, fecha:nowISO(), nota:`Consumo pedido #${pedido.numero}` });
  }
}

function formFidelizacion(){
  const f = DB.fidelizacion;
  openModal('Configuración de Fidelización', `

      <div class="field full"><label>Estado del programa</label>

          <option value="true" ${f.activo?'selected':''}>Activo</option>

        </select>
      </div>
      <div class="field"><label>Monto de consumo por 1 punto (${DB.empresa.moneda})</label>
        <input class="input" type="number" step="0.01" id="fdMonto" value="${num(f.montoPorPunto)}">
        <small style="color:#6b7280;font-size:11.5px">Ej: 10 → cada ${fmtMoney(10)} de consumo = 1 punto</small>
      </div>
      <div class="field"><label>Valor monetario de 1 punto (${DB.empresa.moneda})</label>
        <input class="input" type="number" step="0.01" id="fdValor" value="${num(f.valorPunto)}">
        <small style="color:#6b7280;font-size:11.5px">Cuánto descuenta 1 punto al canjear</small>
      </div>
    </div>`,
    `<button class="btn gray" onclick="closeModal()">Cancelar</button>
     <button class="btn" onclick="guardarFidelizacion()">💾 Guardar</button>`);

function guardarFidelizacion(){
  DB.fidelizacion.activo = $('#fdActivo').value==='true';
  DB.fidelizacion.montoPorPunto = Math.max(0.01, num($('#fdMonto').value));
  DB.fidelizacion.valorPunto = Math.max(0, num($('#fdValor').value));
  saveDB(); closeModal(); VIEWS.fidelizacion(); toast('Configuración de fidelización guardada','success');
}
function ajustePuntos(){
  const cid = $('#canjeCliente').value;
  const pts = num($('#canjePuntos').value);
  const nota = $('#canjeNota').value.trim() || 'Ajuste manual';
  if(!cid){ toast('Seleccione un cliente','error'); return; }
  if(!pts){ toast('Ingrese una cantidad de puntos distinta de cero','error'); return; }
  const c = DB.clientes.find(x=>x.id===cid);
  if(num(c.puntos)+pts < 0){ toast('El cliente no tiene suficientes puntos','error'); return; }
  c.puntos = num(c.puntos)+pts;
  DB.puntos.push({ id:uid('pts'), clienteId:c.id, clienteNombre:c.nombre, tipo: pts>0?'Ajuste (+)':'Canjeado', puntos:pts, fecha:nowISO(), nota, usuario:session.nombre });
  saveDB(); VIEWS.fidelizacion(); toast('Ajuste aplicado a '+c.nombre,'success');
}

          </td>
        </tr>`;}).join('')}
      </tbody>
    </table></div>` : '<div class="empty"><span class="ico">🍔</span>No hay productos registrados</div>'}

};

function formProducto(id){
  if(!isAdmin()){ toast('Solo el administrador puede gestionar productos','error'); return; }
  const p = id ? DB.productos.find(x=>x.id===id) : null;
  // ⭐ Sincronización de seguridad antes de mostrar el formulario
  if(p && Array.isArray(p.receta) && p.receta.length > 0) syncProductCost(p);
  const tieneReceta = p && Array.isArray(p.receta) && p.receta.length > 0;
  const costoReceta = tieneReceta ? calcRecipeCost(p) : 0;
  openModal(p?'Editar Producto':'Nuevo Producto', `

      <span>🔗 <strong>Cadena de costo:</strong></span>

      <span class="arrow">→</span>
      <span>Costo receta: <strong>${fmtMoney(costoReceta)}</strong></span>
      <span class="arrow">→</span>
      <span>Costo producto: <strong>${fmtMoney(costoReceta)}</strong></span>
    </div>` : ''}
    <div class="form-grid">
      <div class="field full"><label>Nombre del producto *</label><input class="input" id="pNombre" value="${esc(p?.nombre||'')}"></div>
      <div class="field"><label>Categoría</label>
        <select class="select" id="pCat">
          <option value="">— Sin categoría —</option>
          ${DB.categorias.map(c=>`<option value="${c.id}" ${p?.categoriaId===c.id?'selected':''}>${esc(c.nombre)}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Estado</label>
        <select class="select" id="pActivo">
          <option value="true" ${p?.activo!==false?'selected':''}>Activo</option>
          <option value="false" ${p?.activo===false?'selected':''}>Inactivo</option>
        </select>
      </div>
      <div class="field"><label>Precio de venta *</label><input class="input" type="number" step="0.01" id="pPrecio" value="${num(p?.precio)||''}"></div>
      <div class="field">
        <label>Costo ${tieneReceta?'(calculado desde receta)':'estimado'}</label>
        <input class="input" type="number" step="0.01" id="pCosto" value="${tieneReceta ? Math.round(costoReceta*100)/100 : (num(p?.costo)||'')}" ${tieneReceta?'readonly style="background:#f3f4f6;cursor:not-allowed"':''}>
        ${tieneReceta ? '<small style="color:#16a34a;font-size:11.5px">🔄 Sincronizado con la receta. Para cambiarlo, edite los insumos o la receta.</small>' : '<small style="color:#6b7280;font-size:11.5px">Si el producto tiene receta, este valor se calculará automáticamente.</small>'}
      </div>
      <div class="field full"><label>Descripción</label><textarea class="input" id="pDesc">${esc(p?.descripcion||'')}</textarea></div>
    </div>`,
    `<button class="btn gray" onclick="closeModal()">Cancelar</button>
     <button class="btn" onclick="guardarProducto('${id||''}')">💾 Guardar</button>`);
}
function guardarProducto(id){
  const nombre = $('#pNombre').value.trim();
  const precio = num($('#pPrecio').value);
  if(!nombre){ toast('El nombre es obligatorio','error'); return; }
  if(precio<=0){ toast('El precio debe ser mayor a cero','error'); return; }
  const data = { nombre, categoriaId:$('#pCat').value, precio, costo:num($('#pCosto').value), activo:$('#pActivo').value==='true', descripcion:$('#pDesc').value.trim() };
  let prod;
  if(id){ prod = DB.productos.find(x=>x.id===id); Object.assign(prod, data); }
  else { prod = { id:uid('prd'), ...data, receta:[], creado:nowISO() }; DB.productos.push(prod); }
  // ⭐ Si el producto tiene receta, el costo SIEMPRE se recalcula desde ella
  if(Array.isArray(prod.receta) && prod.receta.length > 0){
    prod.costo = Math.round(calcRecipeCost(prod) * 100) / 100;
  }
  saveDB(); closeModal(); VIEWS.productos(); toast('Producto guardado','success');
}
function eliminarProducto(id){
  const p = DB.productos.find(x=>x.id===id); if(!p) return;
  confirmDialog('Eliminar producto', `¿Eliminar <strong>${esc(p.nombre)}</strong> del catálogo?`, ()=>{
    DB.productos = DB.productos.filter(x=>x.id!==id); saveDB(); VIEWS.productos(); toast('Producto eliminado','info');
  },'Eliminar');
}

function editarReceta(pid){
  if(!isAdmin()){ toast('Solo el administrador puede editar recetas','error'); return; }
  const p = DB.productos.find(x=>x.id===pid); if(!p) return;
  if(!Array.isArray(p.receta)) p.receta = [];
  // Sincronización de seguridad
  if(p.receta.length > 0) syncProductCost(p);
  _recetaEditing = null;
  renderRecetaModal(pid);
}

function eliminarReceta(pid){
  if(!isAdmin()){ toast('Solo el administrador puede eliminar recetas','error'); return; }
  const p = DB.productos.find(x=>x.id===pid); if(!p) return;
  const n = Array.isArray(p.receta)?p.receta.length:0;
  if(!n){ toast('Este producto no tiene receta definida','info'); return; }
  confirmDialog('Eliminar receta',
    `¿Eliminar la receta de <strong>${esc(p.nombre)}</strong>?<br><br>
     Se quitarán <strong>${n}</strong> insumo(s) de su receta.<br>
     El costo del producto se reiniciará a 0 para que lo ingrese manualmente.`,
    ()=>{
      p.receta = [];
      p.costo = 0;  // ⭐ Sin receta, el costo se reinicia
      _recetaEditing = null;
      saveDB(); VIEWS.recetas();
      toast('Receta eliminada · costo del producto reiniciado a 0','info');
    }, 'Eliminar');
}

function renderRecetaModal(pid){
  const p = DB.productos.find(x=>x.id===pid);
  const rec = p.receta||[];
  const costo = calcRecipeCost(p);
  const editingIx = (_recetaEditing && _recetaEditing.pid===pid) ? _recetaEditing.ix : -1;

  openModal('Receta: '+esc(p.nombre), `
    ${DB.insumos.length? `
    <div class="toolbar">
      <select class="select" id="rInsumo" style="flex:1;min-width:200px">
        <option value="">— Seleccione insumo —</option>

      <span>Insumos: <strong>${fmtMoney(costo)}</strong></span>
      <span class="arrow">→</span>
      <span>Producto: <strong>${fmtMoney(costo)}</strong></span>
      <span class="arrow">→</span>
      <span>Precio venta: <strong>${fmtMoney(p.precio)}</strong></span>
      <span class="arrow">→</span>
      <span>Margen: <strong style="color:${(num(p.precio)-costo)>=0?'#16a34a':'#dc2626'}">${fmtMoney(num(p.precio)-costo)}</strong></span>
    </div>

    <div class="table-wrap"><table>
      <thead><tr><th>Insumo</th><th class="t-right">Cantidad</th><th class="t-right">Costo unit.</th><th class="t-right">Subtotal</th><th class="t-center">Acciones</th></tr></thead>
      <tbody>
        ${rec.length? rec.map((r,ix)=>{
          const ins = DB.insumos.find(i=>i.id===r.insumoId);
          const isEdit = (ix===editingIx);
          return `<tr>
            <td><strong>${esc(ins?ins.nombre:'(eliminado)')}</strong></td>
            <td class="t-right">
              ${isEdit
                ? `<input class="input" id="recEditCant" type="number" step="0.001" min="0.001" value="${num(r.cantidad)}" style="width:100px;padding:4px 8px;text-align:right;display:inline-block" onkeydown="if(event.key==='Enter'){event.preventDefault();guardarEditIngrediente('${pid}',${ix});}">
                   <span style="font-size:11.5px;color:#6b7280;margin-left:4px">${esc(ins?ins.unidad:'')}</span>`
                : `${fmtNum(r.cantidad)} ${esc(ins?ins.unidad:'')}`}
            </td>
            <td class="t-right">${fmtMoney(ins?ins.costo:0)}</td>
            <td class="t-right"><strong>${fmtMoney(ins?num(ins.costo)*num(r.cantidad):0)}</strong></td>
            <td class="t-center" style="white-space:nowrap">
              ${isEdit
                ? `<button class="btn green sm" onclick="guardarEditIngrediente('${pid}',${ix})" title="Guardar">✓ Guardar</button>
                   <button class="btn gray sm" onclick="cancelarEditIngrediente('${pid}')" title="Cancelar">✕</button>`
                : `<button class="btn blue sm" onclick="editarIngrediente('${pid}',${ix})" title="Editar cantidad">✏️</button>
                   <button class="btn red sm" onclick="delIngrediente('${pid}',${ix})" title="Eliminar">🗑️</button>`}
            </td>
          </tr>`;}).join('') : '<tr><td colspan="5" class="t-center" style="color:#9ca3af;padding:22px">Sin ingredientes en la receta</td></tr>'}
      </tbody>
    </table></div>

    <div style="margin-top:16px;margin-left:auto;max-width:360px">
      <div class="tot-row"><span>Costo total de la receta</span><span class="val" style="color:#16a34a">${fmtMoney(costo)}</span></div>

      <div class="tot-row big"><span>Margen bruto</span><span class="val" style="color:${(num(p.precio)-costo)>=0?'#16a34a':'#dc2626'}">${fmtMoney(num(p.precio)-costo)}</span></div>
      <div style="font-size:11.5px;color:#6b7280;margin-top:6px;text-align:right">Este valor se guarda automáticamente como el <em>costo</em> del producto.</div>
    </div>
  `, `<button class="btn gray" onclick="closeModal()">Cerrar</button>`, 'lg');

  if(editingIx>=0){
    setTimeout(()=>{ const el=document.getElementById('recEditCant'); if(el){ el.focus(); el.select(); } }, 80);
  }
}

function addIngrediente(pid){
  const p = DB.productos.find(x=>x.id===pid);
  const insumoId = $('#rInsumo').value;
  const cant = num($('#rCant').value);
  if(!insumoId){ toast('Seleccione un insumo','error'); return; }
  if(cant<=0){ toast('Ingrese una cantidad válida','error'); return; }
  if(!Array.isArray(p.receta)) p.receta=[];
  const ex = p.receta.find(r=>r.insumoId===insumoId);
  if(ex) ex.cantidad = num(ex.cantidad)+cant;
  else p.receta.push({ insumoId, cantidad:cant });
  // ⭐ Sincronizar costo del producto con la receta
  const cambio = syncProductCost(p);
  _recetaEditing = null;
  saveDB();
  refreshUnderlyingView();
  renderRecetaModal(pid);
  toast(cambio ? `Insumo agregado · costo actualizado a ${fmtMoney(p.costo)}` : 'Insumo agregado a la receta','success', 2800);
}

function delIngrediente(pid,ix){
  const p = DB.productos.find(x=>x.id===pid);
  if(!p || !p.receta[ix]) return;
  p.receta.splice(ix,1);
  const quedoVacia = p.receta.length === 0;
  if(quedoVacia){
    // ⭐ Receta vacía: no hay base para calcular, se reinicia el costo
    p.costo = 0;
  } else {
    syncProductCost(p);
  }
  _recetaEditing = null;
  saveDB();
  refreshUnderlyingView();
  renderRecetaModal(pid);
  if(quedoVacia) toast('Receta vacía · costo del producto reiniciado a 0','info',3500);
  else toast(`Ingrediente eliminado · costo actualizado a ${fmtMoney(p.costo)}`,'success',2800);
}

function editarIngrediente(pid, ix){
  const p = DB.productos.find(x=>x.id===pid); if(!p || !p.receta[ix]) return;
  _recetaEditing = { pid, ix };
  renderRecetaModal(pid);
}

function guardarEditIngrediente(pid, ix){
  const inp = document.getElementById('recEditCant');
  const nueva = num(inp ? inp.value : 0);
  if(nueva <= 0){ toast('La cantidad debe ser mayor a cero','error'); return; }
  const p = DB.productos.find(x=>x.id===pid);
  if(!p || !p.receta[ix]) return;
  p.receta[ix].cantidad = nueva;
  syncProductCost(p);
  _recetaEditing = null;
  saveDB();
  refreshUnderlyingView();
  renderRecetaModal(pid);
  toast(`Cantidad actualizada · costo: ${fmtMoney(p.costo)}`,'success',2500);
}

function cancelarEditIngrediente(pid){
  _recetaEditing = null;
  renderRecetaModal(pid);
}

          ${['Unidad','Libra','Kilogramo','Gramo','Litro','Mililitro','Onza','Caja','Paquete','Docena'].map(u=>`<option ${i?.unidad===u?'selected':''}>${u}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Costo unitario</label><input class="input" type="number" step="0.01" id="iCosto" value="${num(i?.costo)||''}"></div>
      <div class="field"><label>Stock actual</label><input class="input" type="number" step="0.001" id="iStock" value="${num(i?.stock)||0}"></div>
      <div class="field"><label>Stock mínimo</label><input class="input" type="number" step="0.001" id="iMin" value="${num(i?.stockMin)||0}"></div>
      <div class="field full"><label>Proveedor</label><input class="input" id="iProv" value="${esc(i?.proveedor||'')}"></div>
    </div>`,
    `<button class="btn gray" onclick="closeModal()">Cancelar</button>
     <button class="btn" onclick="guardarInsumo('${id||''}')">💾 Guardar</button>`);
}
function guardarInsumo(id){
  const nombre = $('#iNombre').value.trim();
  if(!nombre){ toast('El nombre es obligatorio','error'); return; }
  const oldCosto = id ? num(DB.insumos.find(x=>x.id===id)?.costo) : 0;
  const newCosto = num($('#iCosto').value);
  const data = { nombre, unidad:$('#iUnidad').value, costo:newCosto, stock:num($('#iStock').value), stockMin:num($('#iMin').value), proveedor:$('#iProv').value.trim() };
  if(id){ Object.assign(DB.insumos.find(x=>x.id===id), data); }
  else { DB.insumos.push({ id:uid('ins'), ...data, creado:nowISO() }); }

  // ⭐ Si el costo cambió, sincronizamos todos los productos que usan este insumo
  let afectados = 0;
  if(Math.abs(oldCosto - newCosto) > 0.001){
    afectados = syncAllProductCosts();
  }
  saveDB(); closeModal(); VIEWS.inventario();
  if(afectados > 0) toast(`Insumo guardado · ${afectados} producto(s) actualizaron su costo`,'success', 4500);
  else toast('Insumo guardado','success');
}
function eliminarInsumo(id){
  const i = DB.insumos.find(x=>x.id===id); if(!i) return;
  const afectados = DB.productos.filter(p => Array.isArray(p.receta) && p.receta.some(r => r.insumoId === id)).length;
  confirmDialog('Eliminar insumo',
    `¿Eliminar <strong>${esc(i.nombre)}</strong>?${afectados?`<br><br>Se quitará de <strong>${afectados}</strong> receta(s) y esos productos recalcularán su costo.`:''}`,
    ()=>{
      DB.insumos = DB.insumos.filter(x=>x.id!==id);
      DB.productos.forEach(p=>{ if(Array.isArray(p.receta)) p.receta = p.receta.filter(r=>r.insumoId!==id); });
      const cambios = syncAllProductCosts();
      saveDB(); VIEWS.inventario();
      toast(cambios ? `Insumo eliminado · ${cambios} producto(s) recalcularon su costo` : 'Insumo eliminado','info', 4000);
    },'Eliminar');
}
function formMovimiento(id){
  if(!isAdmin()){ toast('Solo el administrador puede registrar movimientos','error'); return; }
  const i = DB.insumos.find(x=>x.id===id); if(!i) return;
  openModal('Movimiento de Inventario', `
    <div class="alert-box info">📦 <strong>${esc(i.nombre)}</strong> · Stock actual: <strong>${fmtNum(i.stock)} ${esc(i.unidad||'')}</strong></div>
    <div class="form-grid">

      </div>
      <div class="field"><label>Cantidad</label><input class="input" type="number" step="0.001" id="mCant" placeholder="0"></div>
      <div class="field full"><label>Motivo / Referencia</label><input class="input" id="mMotivo" placeholder="Compra a proveedor, merma, ajuste de conteo..."></div>
    </div>`,
    `<button class="btn gray" onclick="closeModal()">Cancelar</button>
     <button class="btn green" onclick="guardarMovimiento('${id}')">💾 Registrar</button>`);
}
function guardarMovimiento(id){
  const i = DB.insumos.find(x=>x.id===id); if(!i) return;
  const tipo = $('#mTipo').value;
  const cant = num($('#mCant').value);
  const motivo = $('#mMotivo').value.trim() || tipo;
  if(cant<=0){ toast('Ingrese una cantidad válida','error'); return; }
  if(tipo==='Entrada') i.stock = num(i.stock)+cant;
  else if(tipo==='Salida') i.stock = num(i.stock)-cant;
  else i.stock = cant;
  DB.movimientos.push({ id:uid('mov'), insumoId:i.id, insumoNombre:i.nombre, tipo, cantidad: cant, motivo, fecha: nowISO(), usuario: session.nombre });
  saveDB(); closeModal(); VIEWS.inventario(); toast('Movimiento registrado','success');
}

function descargarRespaldo(){
  const payload = { app:'FastMenu', version:1, exportedAt: nowISO(), exportedBy: session.nombre, data: DB };
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `fastmenu_backup_${todayStr()}_${Date.now().toString().slice(-5)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('Respaldo descargado correctamente','success');
}

function cargarRespaldo(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = ()=>{
    const file = inp.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = e=>{
      try{
        const obj = JSON.parse(e.target.result);
        const data = obj.data || (obj.empresa ? obj : null);
        if(!data || typeof data !== 'object') throw new Error('Formato inválido');
        confirmDialog('Restaurar respaldo',
          `El archivo contiene:<br><br>
           • Clientes: <strong>${(data.clientes||[]).length}</strong><br>
           • Productos: <strong>${(data.productos||[]).length}</strong><br>
           • Insumos: <strong>${(data.insumos||[]).length}</strong><br>
           • Pedidos: <strong>${(data.pedidos||[]).length}</strong><br>
           • Usuarios: <strong>${(data.usuarios||[]).length}</strong><br><br>
           <span style="color:#dc2626;font-weight:600">Se reemplazarán TODOS los datos actuales.</span>`,
          ()=>{
            DB = data;
            normalizeDB();   // aquí se sincronizan los costos automáticamente
            saveDB();
            toast('Respaldo restaurado correctamente','success');
            setTimeout(()=>{ doLogout(); }, 800);
          }, 'Restaurar', true);
      }catch(err){ toast('Archivo JSON inválido: '+err.message,'error'); }
    };
    reader.readAsText(file);
  };
  inp.click();
}

function descargarPlantilla(tipo){
  const cfg = PLANTILLAS[tipo];
  const rows = cfg.ejemplo;
  if(window.XLSX){
    const ws = XLSX.utils.json_to_sheet(rows, {header: cfg.cols});
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, cfg.sheet);
    XLSX.writeFile(wb, cfg.file);
  } else {
    descargarCSV(cfg.file.replace('.xlsx','.csv'), rows, cfg.cols);
  }
  toast('Plantilla de '+tipo+' descargada','success');
}
function descargarCSV(filename, rows, cols){
  const head = cols.join(',');
  const body = rows.map(r=> cols.map(c=>{ const v = r[c]==null?'':String(r[c]); return /[",\n;]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+head+'\n'+body], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
}
function subirPlantilla(tipo){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='.xlsx,.xls,.csv,text/csv';
  inp.onchange = ()=>{
    const file = inp.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = e=>{
      let rows = [];
      try{
        if(window.XLSX){
          const data = new Uint8Array(e.target.result);
          const wb = XLSX.read(data, {type:'array'});
          const ws = wb.Sheets[wb.SheetNames[0]];
          rows = XLSX.utils.sheet_to_json(ws, {defval:''});
        } else {
          const txt = new TextDecoder('utf-8').decode(e.target.result);
          rows = parseCSV(txt);
        }
      }catch(err){ toast('No se pudo leer el archivo: '+err.message,'error'); return; }
      if(!rows.length){ toast('El archivo no contiene filas de datos','error'); return; }
      const res = importarFilas(tipo, rows);
      syncAllProductCosts();    // ⭐ consistencia tras importaciones
      saveDB();
      VIEWS.herramientas();
      if(res.err>0) toast(`Importación: ${res.ok} registro(s) agregado(s), ${res.err} omitido(s).`,'info',5000);
      else toast(`Importación exitosa: ${res.ok} registro(s) agregado(s).`,'success',4000);
    };
    reader.readAsArrayBuffer(file);
  };
  inp.click();
}
function parseCSV(text){
  const lines = text.replace(/\r/g,'').split('\n').filter(l=>l.trim()!=='');
  if(!lines.length) return [];
  const delim = (lines[0].match(/;/g)||[]).length > (lines[0].match(/,/g)||[]).length ? ';' : ',';
  const parseLine = (line)=>{
    const out=[]; let cur=''; let q=false;
    for(let i=0;i<line.length;i++){
      const ch = line[i];
      if(q){ if(ch==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
      else { if(ch==='"') q=true; else if(ch===delim){ out.push(cur); cur=''; } else cur+=ch; }
    }
    out.push(cur);
    return out.map(s=>s.trim());
  };
  const head = parseLine(lines[0]);
  return lines.slice(1).map(l=>{ const vals = parseLine(l); const o = {}; head.forEach((h,i)=> o[h]=vals[i]===undefined?'':vals[i]); return o; });
}
function getField(row, names){
  for(const n of names){
    if(row[n]!==undefined && row[n]!=='') return row[n];
    const key = Object.keys(row).find(k=> k.toLowerCase().trim()===n.toLowerCase());
    if(key && row[key]!=='') return row[key];
  }
  return '';
}
function importarFilas(tipo, rows){
  let ok=0, err=0;
  if(tipo==='clientes'){
    rows.forEach(r=>{
      const nombre = String(getField(r,['Nombre','nombre','Cliente','Nombres'])).trim();
      if(!nombre){ err++; return; }
      const tel = String(getField(r,['Telefono','teléfono','Tel','Celular'])).trim();
      if(tel && DB.clientes.some(c=>String(c.telefono).trim()===tel)){ err++; return; }
      DB.clientes.push({ id: uid('cli'), nombre, telefono:tel, email:String(getField(r,['Email','Correo','correo'])).trim(), direccion:String(getField(r,['Direccion','Dirección','Dir'])).trim(), cumple:String(getField(r,['Cumpleanos','Cumpleaños','FechaNacimiento'])).trim(), puntos: num(getField(r,['Puntos','puntos'])), fechaRegistro: nowISO(), notas:'' });
      ok++;
    });
  }
  else if(tipo==='productos'){
    rows.forEach(r=>{
      const nombre = String(getField(r,['Nombre','Producto','nombre'])).trim();
      if(!nombre){ err++; return; }
      if(DB.productos.some(p=>p.nombre.toLowerCase()===nombre.toLowerCase())){ err++; return; }
      const catNombre = String(getField(r,['Categoria','Categoría','CategoriaNombre'])).trim();
      let catId = '';
      if(catNombre){
        let cat = DB.categorias.find(c=>c.nombre.toLowerCase()===catNombre.toLowerCase());
        if(!cat){ cat = { id:uid('cat'), nombre:catNombre }; DB.categorias.push(cat); }
        catId = cat.id;
      }
      const activoRaw = String(getField(r,['Activo','activo','Estado'])).trim().toLowerCase();
      const activo = !(activoRaw==='no'||activoRaw==='false'||activoRaw==='0'||activoRaw==='inactivo');
      DB.productos.push({ id: uid('prd'), nombre, categoriaId:catId, precio: num(getField(r,['Precio','precio','PrecioVenta'])), costo: num(getField(r,['Costo','costo'])), descripcion: String(getField(r,['Descripcion','Descripción','detalle'])).trim(), activo, receta: [], creado: nowISO() });
      ok++;
    });
  }
  else if(tipo==='insumos'){
    rows.forEach(r=>{
      const nombre = String(getField(r,['Nombre','Insumo','nombre'])).trim();
      if(!nombre){ err++; return; }
      const ex = DB.insumos.find(i=>i.nombre.toLowerCase()===nombre.toLowerCase());
      const data = { unidad: String(getField(r,['Unidad','unidad','UOM','Medida'])).trim() || 'Unidad', stock: num(getField(r,['Stock','Existencia','Cantidad'])), stockMin: num(getField(r,['StockMin','StockMinimo','Minimo','Stock Mínimo'])), costo: num(getField(r,['Costo','CostoUnitario','Precio'])), proveedor: String(getField(r,['Proveedor','proveedor'])).trim() };
      if(ex){ Object.assign(ex, data); }
      else DB.insumos.push({ id:uid('ins'), nombre, ...data, creado:nowISO() });
      ok++;
    });
  }
  return { ok, err };
}
